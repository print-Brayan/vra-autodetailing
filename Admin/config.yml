backend:
  name: github
  repo: print-Brayan/vra-autodetailing
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: /auth

site_url: https://vra-autodetailing.netlify.app
display_url: https://vra-autodetailing.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "configuracion_web"
    label: "Contenido de la Web"
    files:
      - label: "Galería Antes y Después"
        name: "galeria"
        file: "data/galeria.json"
        fields:
          - label: "Casos de Éxito (Puedes añadir todos los que quieras)"
            name: "casos"
            widget: "list"
            fields:
              - { label: "Foto Antes", name: "antes", widget: "image" }
              - { label: "Foto Después", name: "despues", widget: "image" }
